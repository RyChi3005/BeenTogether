<!DOCTYPE html>
<html lang="vi">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
      <meta name="theme-color" content="#2a0d24">
      <meta name="color-scheme" content="dark">
      <script>
            // Lock before first paint; if app.js never runs, lift the lock so the page stays usable.
            document.documentElement.classList.add("js", "is-locked");
            setTimeout(function () { var r = document.documentElement; if (!r.hasAttribute("data-ready")) r.classList.remove("is-locked"); }, 4000);
      </script>
      <title>RyChiBeenTogether❤️</title>
      <link rel="shortcut icon" type="image/png" href="img/favicon.png">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
      <link rel="stylesheet" href="style.css">
</head>
<body>
      <div class="scene" aria-hidden="true">
            <span class="light light--plum"></span>
            <span class="light light--rose"></span>
            <span class="light light--peach"></span>
            <span class="light light--blush"></span>
            <span class="light light--core"></span>
            <span class="wallpaper"></span>
      </div>

      <svg class="glass-defs" width="0" height="0" aria-hidden="true" focusable="false"><defs id="glass-filters"></defs></svg>

      <div class="lock" id="lock">
            <p class="lock__time" data-lock-time>00:00</p>
            <p class="lock__date" data-lock-date></p>
            <button class="notice glass" type="button" data-glass="lens">
                  <img class="notice__icon" src="img/favicon.png" alt="" width="40" height="40">
                  <span class="notice__body">
                        <span class="notice__head"><strong>RyChi</strong><span>bây giờ</span></span>
                        <span class="notice__text">1 tin nhắn mới</span>
                  </span>
            </button>
            <p class="lock__hint">Chạm để mở</p>
      </div>

      <div class="app">
            <header class="bar glass" data-glass="lens" data-lens-blur="6">
                  <span class="faces" aria-hidden="true">
                        <img src="img/terry.webp" alt="" width="36" height="36">
                        <img src="img/mochi.webp" alt="" width="36" height="36">
                  </span>
                  <h1>♌RyChi BeenTogether♑</h1>
            </header>

            <main class="thread">
                  <p class="divider glass"><time datetime="2023-05-30T10:30:05" data-anni>30-05-2023, 10:30</time></p>

                  <div class="pair">
                        <figure class="msg msg--left">
                              <div class="bubble bubble--photo glass">
                                    <img src="img/terry.webp" alt="Terry" width="900" height="600">
                              </div>
                              <figcaption class="msg__name">♌Terry🙆‍♂️</figcaption>
                        </figure>
                        <figure class="msg msg--right">
                              <div class="bubble bubble--photo glass">
                                    <img src="img/mochi.webp" alt="Mochi" width="720" height="722">
                              </div>
                              <figcaption class="msg__name">🙆‍♀️Mochi♑</figcaption>
                        </figure>
                  </div>

                  <div class="msg msg--center">
                        <div class="bubble bubble--count glass" data-glass="lens" data-lens-blur="10">
                              <p class="count">
                                    <span>😋 Dính nhau</span>
                                    <span class="count__days" data-days>0</span>
                                    <span>ngày ròi á 😋</span>
                              </p>
                              <p class="count__clock"><time data-clock>00:00:00</time></p>
                              <span class="tapback" data-tapback aria-hidden="true">
                                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 21s-7.5-4.6-9.8-9.1C.6 8.6 2.5 4.5 6.6 4.5c2.3 0 3.9 1.3 5.4 3.3 1.5-2 3.1-3.3 5.4-3.3 4.1 0 6 4.1 4.4 7.4C19.5 16.4 12 21 12 21z" fill="currentColor"/></svg>
                              </span>
                        </div>
                  </div>
            </main>

      </div>

      <footer class="player glass" data-glass="lens" data-lens-blur="6" data-player>
            <button class="key key--play" type="button" data-toggle aria-label="Phát nhạc">
                  <svg class="icon--play" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.9l10.2-6.4a1 1 0 0 0 0-1.8L9.5 4.7A1 1 0 0 0 8 5.6z" fill="currentColor"/></svg>
                  <svg class="icon--pause" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4" fill="currentColor"/></svg>
            </button>
            <div class="player__info">
                  <span class="player__bar" aria-hidden="true"><span data-progress></span></span>
                  <span class="player__time" data-time>0:00</span>
            </div>
            <button class="key" type="button" data-next aria-label="Bài khác">
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 6.2v11.6a1 1 0 0 0 1.5.8l8.6-5.8a1 1 0 0 0 0-1.6L6.5 5.4A1 1 0 0 0 5 6.2z" fill="currentColor"/><rect x="16.4" y="5" width="3.2" height="14" rx="1.2" fill="currentColor"/></svg>
            </button>
            <audio loop preload="auto">Trình duyệt này không phát được nhạc.</audio>
      </footer>

      <script src="app.js"></script>
</body>
</html>
